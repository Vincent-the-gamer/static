port: 7890
socks-port: 7891
allow-lan: true
mode: Rule
log-level: info
external-controller: :9090
proxies:
  - { name: vpn-ssh, type: socks5, server: 127.0.0.1, port: 11080 }
  - {
      name: vpn-socks5-server,
      type: socks5,
      server: yuan-pi.local,
      port: 11080,
    }
  - { name: vpn-easytier, type: socks5, server: 10.126.126.2, port: 11082 }
proxy-groups:
  - name: Himitsu
    type: select
    proxies:
      - vpn-ssh
      - vpn-socks5-server
      - vpn-easytier
rules:
  - DOMAIN-SUFFIX,cfuture.shop,Himitsu
  - DOMAIN-SUFFIX,pacs.com,Himitsu
  - DOMAIN-SUFFIX,local.genuitec.com,Himitsu
  - IP-CIDR,172.0.0.0/8,Himitsu
  - IP-CIDR,188.188.1.0/24,Himitsu
